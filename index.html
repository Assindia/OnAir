<h2>Sprachausgabe</h2>


<textarea id="text1">



Das Beispiel erzeugt ein Objekt 
Text zu Sprache - TTS

Die Eigenschaften der Sprachausgabe lassen sich beeinflussen. 

Die Rate bestimmt die Geschwindigkeit (Standardwert ist 1).

Pitch legt die Tonhöhe fest (Standardwert ist 1). 

Volume stellt die Lautstärke ein (Standardwert ist 1). 

Bei einem Klick auf den Lautsprecher wird der Text mit speechSynthesis - synth.speak(utterance)  vorgelesen.

Beachte: 
Die maximale Länge des Textes, der in jeder Äußerung gesprochen werden kann, beträgt 32.767 Zeichen.
Das Märchen Hänsel und Gretel müsste man auf zwei Äußerungen verteilen, oder kürzen.

Noch etwas
Die Zeilen, oben im Textfeld kannst du für eigene Versuche nutzen.
Gib einfach etwas ein.



</textarea>

<script>

let menuOpen = false;
let subOpen = true;

function toggleMenu() {
  const menu = document.getElementById('menu');
  menuOpen = !menuOpen;
  menu.classList.toggle('open', menuOpen);
}

function toggleSub() {
  const subs = document.querySelectorAll('.sub');
  subOpen = !subOpen;
  subs.forEach(el => {
    el.style.display = subOpen ? 'block' : 'none';
  });
}

// initial state
window.onload = () => {
  document.querySelectorAll('.sub').forEach(el => {
    el.style.display = 'block';
  });
};


let synth = window.speechSynthesis;

function speakText() {
  let text = document.getElementById("text1").value;
  let utterance = new SpeechSynthesisUtterance(text);
  synth.cancel();
  utterance.rate = 1;
  utterance.pitch = 1;
  utterance.volume = 0.2;
  synth.speak(utterance);  
}

</script>
