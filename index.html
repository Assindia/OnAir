<script>
let menuOpen = false;
let subOpen = true;

function toggleMenu() {
  const menu = document.getElementById('menu');
  menuOpen = !menuOpen;
  menu.classList.toggle('open', menuOpen);
}

function toggleSub() {
  const subs = document.querySelectorAll('.sub');
  subOpen = !subOpen;
  subs.forEach(el => {
    el.style.display = subOpen ? 'block' : 'none';
  });
}

// initial state
window.onload = () => {
  document.querySelectorAll('.sub').forEach(el => {
    el.style.display = 'block';
  });
};
</script>
